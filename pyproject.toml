[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-mcp"
version = "0.1.0"
description = "Local MCP search for an explicit list of Telegram chats."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.3.0",
    "pydantic==2.14.3",
    "Telethon==1.45.0",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[project.scripts]
tg-mcp = "tg_mcp.server:main"
tg-mcp-setup = "tg_mcp.setup_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
